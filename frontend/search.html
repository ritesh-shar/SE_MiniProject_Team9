<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBMS - Search Blood Units</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand">
        🩸 BBMS - Search Blood
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>Search Available Blood Units</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
        Filter blood inventory by blood group and component type (BBMS-F-030).
      </p>

      <div id="alert-box" class="alert" style="display: none;"></div>

      <form id="search-form" style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
        <div class="form-group" style="flex: 1; min-width: 180px; margin-bottom: 0;">
          <label for="bloodGroup">Blood Group</label>
          <select id="bloodGroup" name="bloodGroup">
            <option value="">-- All Blood Groups --</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div class="form-group" style="flex: 1; min-width: 180px; margin-bottom: 0;">
          <label for="component">Component</label>
          <select id="component" name="component">
            <option value="">-- All Components --</option>
            <option value="whole_blood">Whole Blood</option>
            <option value="red_cells">Red Cells</option>
            <option value="plasma">Plasma</option>
            <option value="platelets">Platelets</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="height: 42px;">Search Units</button>
      </form>

      <div id="search-results" style="margin-top: 1.5rem;">
        <p style="color: #666; font-size: 0.95rem;">Select criteria above and click Search.</p>
      </div>
    </div>
  </div>

  <footer>
    BBMS Team 9 &bull; Software Engineering Mini-Project &bull; Sprint 1
  </footer>

  <script src="js/api.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
